<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wildy Chaos Engine</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      height: 100vh;
      width: 100vw;
      background-color: black;
    }

    #main {
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      text-align: center;
      transition: relative;
    }

    .hidden {
      display: none;
    }

    .crazy {
      animation: crazy 0.1s infinite alternate;
    }

    @keyframes crazy {
      0% { transform: rotate(2deg) scale(1.05); }
      25% { transform: rotate(-2deg) scale(1.1); }
      50% { transform: rotate(2deg) scale(1.05); }
      75% { transform: rotate(-2deg) scale(1.1); }
      100% { transform: rotate(2deg) scale(1.05); }
    }

    .confetti, .word {
      position: absolute;
      font-size: 20px;
      pointer-events: none;
    }

    #controls {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      padding: 10px;
      border-radius: 10px;
      z-index: 9999;
      color: white;
      font-size: 14px;
      width: 220px;
      max-height: 80vh;
      overflow-y: auto;
    }

    #controls label, #controls input, #controls textarea {
      display: block;
      margin-bottom: 6px;
      font-family: inherit;
    }

    #controls textarea {
      width: 100%;
      height: 40px;
    }

    #controls input[type="color"],
    #controls input[type="checkbox"] {
      width: 100%;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button {
      width: 100%;
      padding: 5px;
      margin-top: 8px;
      font-size: 16px;
    }

    #settingsToggle {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
    }

    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      font-size: 30px;
      color: white;
      font-weight: bold;
      z-index: 10000;
      text-align: center;
    }
  </style>
</head>
<body>
<div id="settingsToggle" onclick="toggleSettings()">···</div>

<div id="controls">
  <strong>▶️ Settings</strong>
  <label>📝 Message:<br>
    <textarea id="customMessage">Subscribe me on YouTube</textarea>
  </label>
  <label>🖍 Message Color:
    <input type="color" id="messageColor" value="#ffffff">
  </label>
  <label>📏 Message Size (px):
    <input type="number" id="messageSize" value="30" min="10" max="100">
  </label>
  <label>🎉 Confetti Emojis:<br>
    <textarea id="confettiEmojis">🟥 🟧 🟨 🟩</textarea>
  </label>
  <label>💬 Floating Words:<br>
    <textarea id="floatingWords">@noahliNotFond NoahLi404</textarea>
  </label>
  <label>🎨 Background Color (If Custom Image is Used, Leave This Empty):
    <input type="color" id="bgColor" value="#000000">
  </label>
  <label>🟥 Custom Background Image (Choose File):
    <input type="file" id="bgImageFile" accept="image/*">
  </label>
  <label>🎵 Custom Audio (Choose File):
    <input type="file" id="audioFile" accept="audio/*">
  </label>
  <label>🌈 Word Color:
    <input type="color" id="textColor" value="#ffffff">
  </label>
  <label class="toggle-label"><input type="checkbox" id="toggleShake" checked> 💥 Shake</label>
  <label class="toggle-label"><input type="checkbox" id="toggleConfetti" checked> 🎊 Confetti</label>
  <label class="toggle-label"><input type="checkbox" id="toggleWords" checked> 💬 Floating Words</label>
  <label class="toggle-label"><input type="checkbox" id="toggleSound" checked> 🔊 Sound</label>
  <button onclick="startParty()">Start</button>
</div>

<div id="main">
  <div id="message" class="hidden"></div>
</div>

<audio id="partySound" preload="auto"></audio>

<script>
let confettiInterval, wordInterval;

function parseTextColor(text) {
  const parts = text.split(':');
  return {
    text: parts[0].trim(),
    color: parts[1] ? parts[1].trim() : null
  };
}

function startParty() {
  document.getElementById('controls').style.display = 'none';

  const msg = document.getElementById('customMessage').value;
  const msgColor = document.getElementById('messageColor').value;
  const emojis = document.getElementById('confettiEmojis').value.split(' ').map(e => e.trim());
  const words = document.getElementById('floatingWords').value.split(' ').map(w => parseTextColor(w));
  const bgColor = document.getElementById('bgColor').value;
  const textColor = document.getElementById('textColor').value;
  const messageSize = document.getElementById('messageSize').value;
  const doShake = document.getElementById('toggleShake').checked;
  const doConfetti = document.getElementById('toggleConfetti').checked;
  const doWords = document.getElementById('toggleWords').checked;
  const doSound = document.getElementById('toggleSound').checked;

  const bgImageFile = document.getElementById('bgImageFile').files[0];
  if (bgImageFile) {
    const bgImageURL = URL.createObjectURL(bgImageFile);
    document.body.style.backgroundImage = `url(${bgImageURL})`;
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundColor = 'transparent';
  } else {
    document.body.style.backgroundImage = 'none';
    document.body.style.backgroundColor = bgColor;
  }

  const messageEl = document.getElementById('message');
  messageEl.innerText = msg;
  messageEl.classList.remove('hidden');
  messageEl.style.color = msgColor;
  messageEl.style.fontSize = `${messageSize}px`;

  if (doShake) document.getElementById('main').classList.add('crazy');

  if (doSound) {
    const audioFileInput = document.getElementById('audioFile').files[0];
    const sound = document.getElementById('partySound');
    if (audioFileInput) {
      const audioURL = URL.createObjectURL(audioFileInput);
      sound.src = audioURL;
      sound.play();
    }
  }

  if (doConfetti) {
    confettiInterval = setInterval(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      c.style.left = Math.random() * window.innerWidth + 'px';
      c.style.top = '-50px';
      document.body.appendChild(c);
      let fall = setInterval(() => {
        c.style.top = (parseFloat(c.style.top) + 5) + 'px';
        if (parseFloat(c.style.top) > window.innerHeight) {
          c.remove();
          clearInterval(fall);
        }
      }, 30);
    }, 200);
  }

  if (doWords) {
    wordInterval = setInterval(() => {
      const wordData = words[Math.floor(Math.random() * words.length)];
      const w = document.createElement('div');
      w.className = 'word';
      w.innerText = wordData.text;
      w.style.left = Math.random() * window.innerWidth + 'px';
      w.style.top = '-50px';
      w.style.color = wordData.color || textColor;
      w.style.fontSize = (14 + Math.random() * 14) + 'px';
      document.body.appendChild(w);

      let fall = setInterval(() => {
        w.style.top = (parseFloat(w.style.top) + 7) + 'px';
        if (parseFloat(w.style.top) > window.innerHeight) {
          w.remove();
          clearInterval(fall);
        }
      }, 30);
    }, 500);
  }
}

function stopParty() {
  clearInterval(confettiInterval);
  clearInterval(wordInterval);
  document.getElementById('message').classList.add('hidden');
  document.getElementById('main').classList.remove('crazy');
  const sound = document.getElementById('partySound');
  sound.pause();
  sound.currentTime = 0;
  document.querySelectorAll('.confetti, .word').forEach(el => el.remove());
}

function toggleSettings() {
  const settings = document.getElementById('controls');
  settings.style.display = settings.style.display === 'none' ? 'block' : 'none';
}
</script>
</body>
</html>
